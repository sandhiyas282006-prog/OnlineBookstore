<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Bookstore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .search-box {
            text-align: center;
            margin: 25px 0;
        }

        .search-box input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .book h2 {
            margin-top: 0;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
        }

        .details {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Online Bookstore</h1>

    <div class="search-box">
        <form method="GET">
            <input
                type="text"
                name="search"
                placeholder="Search by book title or author"
                value="{{ search_query|default:'' }}"
            >

            <button type="submit">Search</button>
        </form>
    </div>

    <div class="books">

        {% for book in books %}

        <div class="book">

            <h2>{{ book.title }}</h2>

            <p><strong>Author:</strong> {{ book.author }}</p>

            <p>{{ book.description }}</p>

            <p class="price">₹{{ book.price }}</p>

            <a
                href="{% url 'book_detail' book.id %}"
                class="details"
            >
                View Details
            </a>

        </div>

        {% empty %}

        <p>No books found.</p>

        {% endfor %}

    </div>

</body>
</html>
